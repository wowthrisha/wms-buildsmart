<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — BuildSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <style>
    .auth-layout { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; background: var(--ink); }
    .auth-banner { position: relative; background: linear-gradient(135deg, rgba(20,20,25,0.9), rgba(10,10,12,0.95)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop') center/cover; display: flex; flex-direction: column; justify-content: flex-end; padding: 60px; color: #fff; }
    .auth-form-wrap { display: flex; flex-direction: column; justify-content: center; padding: 40px 10%; }
    .auth-box { width: 100%; max-width: 420px; margin: 0 auto; }
    .login-logo { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 40px; text-decoration: none; }
    .logo-gem { width: 36px; height: 36px; background: var(--gold-grad); border-radius: 10px; display: grid; place-items: center; box-shadow: 0 0 20px var(--gold-glow); }
    .logo-gem svg { width: 18px; height: 18px; stroke: #000; stroke-width: 2.5; fill: none; }
    .logo-wordmark { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--chalk); letter-spacing: -0.5px; }
    .logo-wordmark b { color: var(--gold); font-weight: 800; }
    .auth-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--chalk); margin-bottom: 8px; }
    .auth-subtitle { font-size: 14px; color: var(--chalk-3); margin-bottom: 32px; }
    @media (max-width: 900px) { .auth-layout { grid-template-columns: 1fr; } .auth-banner { display: none; } .auth-form-wrap { padding: 40px 24px; } }
  </style>
</head>
<body>
<div class="auth-layout">
  <div class="auth-banner">
    <div style="position:relative; z-index:10; max-width:480px;">
      <h2 style="font-family:'Syne'; font-size:42px; font-weight:800; color:var(--chalk);">Secure Access.</h2>
      <p style="font-size:16px; color:var(--chalk-2); line-height:1.6;">Recover your account securely. We'll send a magic link to your email to help you set a new password.</p>
    </div>
  </div>
  <div class="auth-form-wrap">
    <div class="auth-box">
      <a href="/" class="login-logo">
        <div class="logo-gem"><svg viewBox="0 0 24 24"><polygon points="12,2 22,8 22,16 12,22 2,16 2,8"/></svg></div>
        <span class="logo-wordmark">Build<b>Smart</b></span>
      </a>
      <h1 class="auth-title">Recover Password</h1>
      <p class="auth-subtitle">Enter your email to receive a reset link.</p>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 12px; padding: 14px; font-size: 15px;">Send Reset Link</button>
      </form>
      <div style="margin-top:24px; text-align:center; font-size:13px; color:var(--chalk-3);">
        Remembered it? <a href="{{ url_for('auth.login') }}" style="color:var(--gold); font-weight:600; text-decoration:none;">Log In</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
